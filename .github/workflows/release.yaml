name: Release

# タグpushでghcrへmulti-arch imageをpushし、cosign署名+provenance+SBOMを付与
# install manifestをReleaseに添付する。workflow_dispatchはpushなしのbuild検証のみ
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write # cosign keyless署名 + provenance attestationのOIDC
  attestations: write # attest-build-provenance

env:
  IMG: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    # 保護環境。GitHub側でrequired reviewers/tag制限を設定し、リリース公開に承認ゲートをかける
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: verify release version
        if: github.ref_type == 'tag'
        run: test "$(cat VERSION)" = "${{ github.ref_name }}"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          # in-toto SLSA provenance + SBOMをimageへ添付
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMG }}:${{ github.ref_name }}
            ${{ env.IMG }}:latest

      - name: cosign sign
        # keyless署名(OIDC)。利用者は cosign verify で真正性を検証できる
        if: github.ref_type == 'tag'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMG}@${DIGEST}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.ref_type == 'tag'
        with:
          subject-name: ${{ env.IMG }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: build install manifests
        # manifestはdigest固定(tag@sha256:...)にし、タグ再pushでも既存installが影響されないようにする
        # workflow_dispatch(push無し)はdigestが出ないためtagのみで検証
        run: |
          make kustomize
          REF="${IMG}:${{ github.ref_name }}"
          if [ -n "${{ steps.build.outputs.digest }}" ]; then
            REF="${REF}@${{ steps.build.outputs.digest }}"
          fi
          cd config/manager && ../../bin/kustomize edit set image "controller=${REF}" && cd ../..
          mkdir -p dist
          ./bin/kustomize build config/default > dist/install.yaml
          ./bin/kustomize build config/default-webhook > dist/install-webhook.yaml

      # dist/はbuild install manifestsで作成済みのため、その後にSBOMを書き出す
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        if: github.ref_type == 'tag'
        with:
          image: ${{ env.IMG }}@${{ steps.build.outputs.digest }}
          output-file: dist/sbom.spdx.json

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        if: github.ref_type == 'tag'
        with:
          generate_release_notes: true
          files: |
            dist/install.yaml
            dist/install-webhook.yaml
            dist/sbom.spdx.json
